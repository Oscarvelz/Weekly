# Weekly for Android: builds the shell from android/ on main. It never signs with a key from this repo and never
# publishes a release by itself. Output: the UNSIGNED release APK as the artifact weekly-unsigned-<run number>,
# which is signed privately and published from the orphan branch android-signed (release android-<run number>).
# versionCode = run number, so each release must come from a newer run.
name: Weekly for Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build (unsigned)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
      - run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk Weekly-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-unsigned-${{ github.run_number }}
          path: Weekly-unsigned.apk
          retention-days: 30
